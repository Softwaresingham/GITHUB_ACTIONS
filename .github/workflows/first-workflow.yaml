name: Java Build

on:
  push

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: mvn clean package

      - name: Upload JAR

        uses: actions/upload-artifact@v4

        with:
          name: login-app

          path: target/*.jar
